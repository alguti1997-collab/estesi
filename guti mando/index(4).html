<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GUTI GG · Overlay de mando</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;color:#22d3ee}
  body{display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%;max-width:960px;overflow:visible}
  .hue{animation:hue 12s linear infinite}
  @keyframes hue{to{filter:hue-rotate(360deg)}}
  #breathe{animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{50%{filter:drop-shadow(0 0 9px #a855f7)}}
  .btn{fill:#14103a;stroke:#7c6cf0;stroke-width:2;stroke-linejoin:round;transition:fill .05s,filter .05s,transform .08s;transform-box:fill-box;transform-origin:center}
  .on{filter:drop-shadow(0 0 10px currentColor);transform:scale(1.14)}
  .c-tri{color:#22f5a8}.c-cir{color:#ff4d6d}.c-crs{color:#4da3ff}.c-sqr{color:#ff7ae1}
  .c-tri.on{fill:#22f5a8}.c-cir.on{fill:#ff4d6d}.c-crs.on{fill:#4da3ff}.c-sqr.on{fill:#ff7ae1}
  .dp,.sm,.bump,.ps{color:#fff}
  .dp.on,.sm.on,.bump.on,.ps.on{fill:#fff}
  .glyph{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .logo{font-family:"Impact","Arial Black",sans-serif;font-style:italic;font-weight:900}
  .wave{fill:none;stroke:currentColor;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:wave .55s ease-out forwards;pointer-events:none}
  @keyframes wave{to{transform:scale(2.6);opacity:0}}
  #avatar{transform-box:fill-box;transform-origin:center;transition:transform .08s,filter .08s}
  #avatar.on{transform:scale(1.04);filter:drop-shadow(0 0 12px #22d3ee)}
  .shine{animation:sweep 4.5s ease-in-out infinite}
  @keyframes sweep{0%,55%{transform:translateX(-170px)}100%{transform:translateX(170px)}}
  .flame{transform-box:fill-box;transform-origin:right center;animation:flick .16s ease-in-out infinite alternate}
  @keyframes flick{to{transform:scaleX(.65)}}
  .chev{fill:none;stroke:#ff9a2e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.3;transition:opacity .1s}
  #chev.go .chev{opacity:1;filter:drop-shadow(0 0 4px #ff9a2e)}
  .pad-glow{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  #ls{fill:url(#ko);stroke:#ffb089;color:#ff6a3c}#ls.on{fill:#ffb089}
  #rs{fill:url(#kb);stroke:#a5b4fc;color:#7c8cff}#rs.on{fill:#a5b4fc}
  .fl{opacity:0;transition:opacity .12s}
  svg.boosting .fl{opacity:1}
  .bp{opacity:.6;transition:opacity .12s}
  svg.boosting .bp{opacity:1;filter:drop-shadow(0 0 8px currentColor)}
  @media (prefers-reduced-motion:reduce){.hue,#breathe,.shine,.flame,.pad-glow{animation:none}}
</style>
</head>

  <!-- almohadilla de boost grande (hexágono con chevrón) en el hombro izquierdo -->
  <g transform="translate(112 86)">
    <use href="#hx" transform="scale(1.5)" fill="#ff9a2e" fill-opacity=".18" stroke="#ff9a2e" stroke-width="1.6"/>
    <polyline points="-4,4 0,-4 4,4" fill="none" stroke="#ff9a2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- almohadillas de boost (se encienden al usar □) -->
  <g class="bp" style="color:#ff9a2e" transform="translate(66 282)">
    <use href="#hx" transform="scale(2.5)" fill="#ea580c" fill-opacity=".3" stroke="currentColor" stroke-width="2.2"/>
    <use href="#hx" transform="scale(1.7)" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity=".6"/>
    <polyline points="-8,3 0,-5 8,3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-8,10 0,2 8,10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
  </g>
  <g class="bp" style="color:#22d3ee" transform="translate(414 282)">
    <use href="#hx" transform="scale(2.5)" fill="#2563eb" fill-opacity=".3" stroke="currentColor" stroke-width="2.2"/>
    <use href="#hx" transform="scale(1.7)" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity=".6"/>
    <polyline points="-8,3 0,-5 8,3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-8,10 0,2 8,10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
  </g>
  <!-- chevrones y etiqueta de boost -->
  <g id="chev"><polyline class="chev" points="384,78 391,84 384,90"/><polyline class="chev" points="394,78 401,84 394,90"/><polyline class="chev" points="404,78 411,84 404,90"/></g>

  <!-- medidor de boost estilo HUD (se gasta con □, se recarga solo) -->
  <g transform="translate(240 203)">
    <circle r="21" fill="#08061c" stroke="#3b2f8f" stroke-width="2"/>
    <circle r="16.5" fill="none" stroke="#2a2170" stroke-width="4"/>
    <circle id="gauge" r="16.5" fill="none" stroke="#ff9a2e" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="0" transform="rotate(-90)" pathLength="100.5"/>
    <text id="boostn" class="logo" y="3" font-size="13" fill="#fff" text-anchor="middle">100</text>
    <text class="logo" y="10.5" font-size="4.6" letter-spacing="1" fill="#ff9a2e" text-anchor="middle">BOOST</text>
  </g>

  <g id="fx"></g>
</svg>

<script>
const q = s => document.querySelectorAll(s), $ = id => document.getElementById(id);
const els = {}, prev = {};
q('[data-b]').forEach(e => (els[e.dataset.b] ??= []).push(e));
const R = 10, DEAD = .12, NS = 'http://www.w3.org/2000/svg';
let boost = 100, last = performance.now(), fxSpeed = 0;

// Prueba con teclado: J=□ K=X L=O I=△ WASD=cruceta Espacio=touchpad Q/E=L1/R1 Z/C=L2/R2
const keys = {}, map = {j:2,k:0,l:1,i:3,q:4,e:5,Enter:9,Tab:8,w:12,s:13,a:14,d:15,' ':17,p:16,z:6,c:7};
addEventListener('keydown', e => { if (e.key in map) { keys[map[e.key]] = 1; e.preventDefault(); } if (e.key.startsWith('Arrow')) { arrows[e.key] = 1; e.preventDefault(); } });
addEventListener('keyup',   e => { delete keys[map[e.key]]; delete arrows[e.key]; });
const arrows = {}; // Flechas = stick izquierdo (solo para probar sin mando)

function wave(el) {
  const b = el.getBBox(), c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', b.x + b.width / 2); c.setAttribute('cy', b.y + b.height / 2);
  c.setAttribute('r', Math.min(Math.max(b.width, b.height) / 2, 40));
  c.setAttribute('class', 'wave');
  c.style.color = getComputedStyle(el).color;
  c.addEventListener('animationend', () => c.remove());
  $('fx').appendChild(c);
}
// Efecto limpio al mover un stick: bolita naranja vivo, estela y arco cian, con estela sobre el borde
const TR_MS = 500, TR_N = 28, hist = [], dots = [];
for (let i = 0; i < TR_N; i++) { const c = document.createElementNS(NS, 'circle'); c.setAttribute('opacity', 0); $('lstrail').appendChild(c); dots.push(c); }
function stickFx(id, x, y, cx, cy, l3, now) {
  const m = Math.min(1, Math.hypot(x, y)), on = m > 0, r = 32;
  const col = `hsl(185 100% ${Math.round(58 + 14 * m)}%)`;      // estela y arco: cian, más claro al inclinar a tope
  const capCol = 'hsl(30 100% 58%)';                          // bolita: naranja vivo
  const cap = $(id), arc = $(id + 'arc'), a = Math.atan2(y, x);
  cap.style.fill = on && !l3 ? capCol : '';
  cap.style.stroke = on ? '#fff' : '';
  cap.style.strokeWidth = on ? 3 : '';
  if (on) {
    const p = t => `${cx + Math.cos(t) * r} ${cy + Math.sin(t) * r}`;
    arc.setAttribute('d', `M${p(a - .45)}A${r} ${r} 0 0 1 ${p(a + .45)}`);
    arc.setAttribute('stroke', col); arc.setAttribute('stroke-width', 4 + m * 1.5);
    if (!hist.length || now - hist[0].t >= 18) hist.unshift({ t: now, a, m, col });
  }
  arc.setAttribute('opacity', on ? 1 : 0);
  while (hist.length && now - hist[hist.length - 1].t > TR_MS) hist.pop();
  dots.forEach((c, i) => {
    const h = hist[i]; if (!h) return c.setAttribute('opacity', 0);
    const k = 1 - (now - h.t) / TR_MS;
    c.setAttribute('cx', cx + Math.cos(h.a) * r); c.setAttribute('cy', cy + Math.sin(h.a) * r);
    c.setAttribute('r', 1 + 3.2 * k * (.5 + .5 * h.m)); c.setAttribute('fill', h.col); c.setAttribute('opacity', Math.max(0, k) * .9);
  });
}
function stick(id, x, y, cx, cy) {
  if (Math.hypot(x, y) < DEAD) x = y = 0;
  for (const k of [id, id + '2']) { $(k).setAttribute('cx', cx + x * R); $(k).setAttribute('cy', cy + y * R); }
  return [x, y];
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, .1); last = now;
  const gp = [...(navigator.getGamepads?.() || [])].find(g => g && g.connected);
  const pressed = {};
  let t = [0, 0], rs = [0, 0], ls = [0, 0];
  if (gp) {
    gp.buttons.forEach((b, i) => { if (b.pressed) pressed[i] = 1; });
    t = [gp.buttons[6]?.value || 0, gp.buttons[7]?.value || 0];
    ls = stick('ls', gp.axes[0], gp.axes[1], 170, 192);
    rs = stick('rs', gp.axes[2], gp.axes[3], 310, 192);
  }
  Object.assign(pressed, keys);
  if (!gp && (arrows.ArrowLeft || arrows.ArrowRight || arrows.ArrowUp || arrows.ArrowDown)) {
    ls = stick('ls', (arrows.ArrowRight ? 1 : 0) - (arrows.ArrowLeft ? 1 : 0), (arrows.ArrowDown ? 1 : 0) - (arrows.ArrowUp ? 1 : 0), 170, 192);
  } else if (!gp) ls = stick('ls', 0, 0, 170, 192);
  stickFx('ls', ls[0], ls[1], 170, 192, !!pressed[10], now);
  if (keys[6]) t[0] = 1; if (keys[7]) t[1] = 1;
  for (const id in els) {
    const on = !!pressed[id];
    els[id].forEach(e => e.classList.toggle('on', on));
    if (on && !prev[id] && id !== '17') wave(els[id][0]);
    prev[id] = on;
  }
  const h = v => 30 * v;
  $('l2').setAttribute('y', 48 - h(t[0])); $('l2').setAttribute('height', h(t[0]) + .01);
  $('r2').setAttribute('y', 48 - h(t[1])); $('r2').setAttribute('height', h(t[1]) + .01);

  // Boost: el botón cuadrado (□) lo gasta (33/s), al soltar se recarga despacio
  const v = pressed[2] ? 1 : 0, boosting = !!v && boost > 0;
  boost = Math.max(0, Math.min(100, boost + (boosting ? -33 * dt : 12 * dt)));
  $('gauge').setAttribute('stroke-dashoffset', 100.5 * (1 - boost / 100));
  $('gauge').setAttribute('stroke', boost < 25 ? '#ff4d6d' : '#ff9a2e');
  $('boostn').textContent = Math.round(boost);

  $('img').setAttribute('transform', `translate(${rs[0] * 3} ${rs[1] * 2})`);
  const pe = $('padedge');
  pe.style.filter = boosting ? `drop-shadow(0 0 ${6 + v * 12}px #ff9a2e)` : '';
  pe.setAttribute('stroke', boosting ? '#ff9a2e' : 'url(#edge)');
  pe.setAttribute('stroke-width', boosting ? 4.5 : 3);
  $('bar').setAttribute('fill', boosting ? '#ff9a2e' : '#22d3ee');
  $('chev').classList.toggle('go', boosting);
  document.querySelector('svg').classList.toggle('boosting', boosting);

  // Efecto de boost: las porterías se iluminan según el boost que queda
  fxSpeed += ((boosting ? 1 : 0) - fxSpeed) * Math.min(1, dt * 8);        // sube y baja suave
  const glow = fxSpeed * (.3 + .7 * boost / 100);
  ['goalL', 'goalR'].forEach(id => {
    const g = $(id);
    g.querySelector('.glow').setAttribute('fill-opacity', .7 * glow);
    g.querySelector('.frame').setAttribute('stroke-width', 3 + 1.5 * glow);
    g.querySelector('.frame').setAttribute('stroke-opacity', .75 + .25 * glow);
    g.querySelector('.net').setAttribute('opacity', .35 + .65 * glow);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
